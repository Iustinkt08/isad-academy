# Deploy automat pe cPanel la fiecare push pe `main` (owner 2026-07-26).
# Build-ul rulează pe Linux (binarele sharp ies corecte nativ), paginile statice se
# pre-randează din DB-ul de PRODUCȚIE printr-un tunel SSH (Postgres-ul serverului nu e
# expus public), iar bundle-ul ajunge pe server prin rsync + restart Passenger.
# Secretele stau EXCLUSIV în GitHub Actions Secrets — vezi DEPLOY-CPANEL.md §CI.
name: Deploy production (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Postgres LOCAL pe runner: build-ul pre-randează dintr-un snapshot al DB-ului de
    # producție (o comandă ssh de câteva secunde), NU printr-un tunel ținut deschis —
    # Hosterion omoară sesiunile SSH persistente după ~1-2 minute (2026-07-26).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: isad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (quality gate)
        run: npx vitest run tests/unit

      # O SINGURĂ conexiune TCP pe tot deploy-ul (ControlMaster): tunelul DB, scp-ul
      # și restart-ul se multiplexează prin ea. Firewall-ul Hosterion (Imunify/CSF)
      # a blocat temporar SSH-ul când fiecare run deschidea 4-5 conexiuni separate.
      - name: Load SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h-%p
            ControlPersist 20m
            ServerAliveInterval 15
            ServerAliveCountMax 8
            TCPKeepAlive yes
          EOF

      # DIAGNOSTIC TEMPORAR (2026-07-27, de șters după fix): conexiunea mux moare cu
      # "Broken pipe" imediat după KEX, iar masterul demonizat înghite eroarea reală.
      # A izolează transportul (fără mux), B reproduce config-ul curent, verbose.
      # IP-urile se maschează — repo public, iar IP-ul rezolvat nu e mascat de Actions.
      - name: SSH diagnostic (temporar)
        run: |
          set +e
          mask() { sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/x.x.x.x/g'; }
          echo "=== A: ssh simplu, fara mux ==="
          ssh -vv -S none -o ControlMaster=no deploy 'echo SSH_OK' 2>&1 | mask | tail -60
          echo "=== B: ssh cu mux (config curent) ==="
          ssh -vv deploy 'echo MUX_OK' 2>&1 | mask | tail -40
          true

      # Snapshot-ul DB de producție într-o comandă ssh de câteva secunde (sesiunile
      # scurte trec de firewall-ul hostului; cele persistente sunt omorâte).
      - name: Snapshot production DB into runner Postgres
        run: |
          ssh deploy "pg_dump --no-owner --no-privileges '${{ secrets.PROD_DATABASE_URI }}'" > prod.sql
          test -s prod.sql
          psql "postgres://postgres:ci@127.0.0.1:5432/isad" -q -v ON_ERROR_STOP=0 -f prod.sql > /dev/null
          rm prod.sql

      - name: Build (standalone)
        env:
          DATABASE_URI: postgres://postgres:ci@127.0.0.1:5432/isad
          PAYLOAD_SECRET: ${{ secrets.PROD_PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://isad.academy
        run: npm run build

      - name: Assemble bundle
        run: |
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public

      # Hosterion nu are rsync pe server — transferul se face cu tar+scp. Ștergerea
      # explicită a directoarelor de aplicație dă semantica lui `rsync --delete`;
      # media/ (uploads) și tmp/ (restart Passenger) NU se ating.
      - name: Upload bundle (tar prin SSH; media/ și tmp/ rămân neatinse)
        run: |
          tar czf bundle.tar.gz -C deploy .
          scp bundle.tar.gz deploy:~/bundle.tar.gz
          ssh deploy \
            "cd '${{ secrets.APP_DIR }}' && rm -rf .next node_modules public server.js package.json && tar xzf ~/bundle.tar.gz && rm ~/bundle.tar.gz"

      - name: Restart Passenger app
        run: ssh deploy "mkdir -p '${{ secrets.APP_DIR }}/tmp' && touch '${{ secrets.APP_DIR }}/tmp/restart.txt'"

      # Atingerea lui restart.txt NU înseamnă că aplicația a pornit. Pe 2026-07-29 o migrație
      # eșuată a omorât boot-ul, Passenger a dat 503 pe tot site-ul, iar workflow-ul a raportat
      # "success" — de aici pasul de mai jos, care eșuează dacă aplicația nu răspunde.
      # `/admin` e verificat separat: e prima rută care cade când migrațiile nu s-au aplicat.
      - name: Verify the app actually booted
        run: |
          site="https://isad.academy"
          for i in $(seq 1 20); do
            sleep 6
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$site/" || true)"
            echo "încercare $i: / -> $code"
            if [ "$code" = "200" ]; then
              admin="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$site/admin" || true)"
              echo "/admin -> $admin"
              if [ "$admin" != "200" ]; then
                echo "::error::Site-ul răspunde, dar /admin dă $admin — verifică RUN_MIGRATIONS și logurile aplicației."
                exit 1
              fi
              echo "Deploy verificat: / și /admin răspund 200."
              exit 0
            fi
          done
          echo "::error::Aplicația nu răspunde 200 după restart (ultimul cod: $code). Vezi stderr-ul aplicației în cPanel → Setup Node.js App."
          exit 1
